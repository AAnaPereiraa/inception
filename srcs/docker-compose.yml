services:
  mariadb:
    container_name: mariadb
    image: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    restart: always
    volumes:
      - vol-mariadb:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  wordpress:
    container_name: wordpress
    image: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - vol-wordpress:/var/www/html
    networks:
      - inception

  nginx:
    container_name: nginx
    image: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: always
    ports:
      - "443:443"
    depends_on:
      - wordpress
    volumes:
      - vol-wordpress:/var/www/html
    networks:
      - inception

networks:
  inception:
    name: inception
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  vol-mariadb:
    name: vol-mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ana-pdos/data/mariadb
  vol-wordpress:
    name: vol-wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ana-pdos/data/wordpress
