services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    secrets:
      - db_password
      - db_admin_password
      - db_root_password
    environment:
      DB_NAME: "${DB_NAME:-mariadb}"
      DB_USER: "${DB_USER:-user1}"
      DB_ADMIN: "${DB_ADMIN:-adm}"
      DB_PORT: "${DB_PORT:-3306}"
    restart: unless-stopped
    volumes:
      - vol-mariadb:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  
  wordpress:
    container_name: wordpress
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    secrets:
      - db_password
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME:-localhost}"
      WP_TITLE: "${WP_TITLE:-Inception}"
      WP_ADMIN_USER: "${WP_ADMIN_USER:-user}"
      WP_ADMIN_PASSWORD: "${WP_ADMIN_PASSWORD:-1234}"
      WP_ADMIN_EMAIL: "${WP_ADMIN_EMAIL:-user@user.com}"
      WP_USER: "${WP_USER:-subscriber}"
      WP_USER_PASSWORD: "${WP_USER_PASSWORD:-1234}"
      WP_USER_EMAIL: "${WP_USER_EMAIL:-subscriber@user.com}"
      DB_HOST: "${DB_HOST:-mariadb}"
      DB_NAME: "${DB_NAME:-wordpress}"
      DB_USER: "${DB_USER:-user1}"
      DB_PORT: "${DB_PORT:-3306}"
      WP_PORT: "${WP_PORT:-9000}"
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - vol-wordpress:/var/www/html
    networks:
      - inception
  nginx:
    container_name: nginx
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NGINX_PORT: "${NGINX_PORT:-443}"
      WP_PORT: "${WP_PORT:-9000}"
    ports:
      - "${NGINX_PORT:-443}:443"
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - vol-wordpress:/var/www/html
    networks:
      - inception
      
networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_admin_password:
    file: ../secrets/db_admin_password.txt

volumes:
  vol-mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/mariadb
  vol-wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/wordpress